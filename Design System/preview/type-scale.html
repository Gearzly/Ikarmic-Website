<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="common.css">
<style>

.row .spec { color: #525252; font-family: "JetBrains Mono", monospace; font-size: 10px; min-width: 80px; }

</style></head><body>
<div class="card" style="padding: 28px; gap: 6px;">

  <div class="row"><span class="name">body-lg</span><span style="font-size:16px; color:#a3a3a3;">Aa</span><span class="spec">18 · 400 · n-400</span></div>
  <div class="row"><span class="name">body</span><span style="font-size:14px; color:#a3a3a3;">Aa</span><span class="spec">16 · 400 · n-400</span></div>
  <div class="row"><span class="name">sm</span><span style="font-size:13px; color:#a3a3a3;">Aa</span><span class="spec">14 · 400</span></div>
  <div class="row"><span class="name">xs / meta</span><span style="font-size:11px; color:#525252;">Aa</span><span class="spec">12 · 400 · n-600</span></div>
</div>
</body></html>
