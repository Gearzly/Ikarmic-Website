<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="common.css">
<style>
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
@keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.demo { background: #171717; border: 1px solid #262626; border-radius: 12px; padding: 14px; }
.demo .label { font-size: 10px; color: #818cf8; font-family: "JetBrains Mono", monospace; margin-bottom: 8px; font-weight: 600; }
.demo .stage { height: 50px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
.fade-box { font-size: 13px; color: #fff; animation: fadeUp 0.5s ease infinite alternate; }
.float-box { width: 30px; height: 30px; border-radius: 8px; background: rgba(99,102,241,0.4); animation: float 3s ease-in-out infinite; }
.ticker-stage { white-space: nowrap; }
.ticker-row { display: inline-flex; gap: 18px; animation: ticker 8s linear infinite; font-size: 11px; color: #a3a3a3; }
.dot-pulse { width: 10px; height: 10px; border-radius: 50%; background: #818cf8; animation: pulse 1.5s ease-in-out infinite; }
.spec { font-size: 10px; color: #525252; font-family: "JetBrains Mono", monospace; margin-top: 6px; }
</style></head><body>
<div class="card" style="padding: 22px 28px;">
  <p class="eyebrow" style="margin-bottom: 0;">Motion · Calm, No Bounces</p>
  <div class="grid">
    <div class="demo">
      <div class="label">FadeUp · stagger</div>
      <div class="stage"><div class="fade-box">Hello</div></div>
      <div class="spec">0.4s · cubic(0.25,0.46,0.45,0.94)</div>
    </div>
    <div class="demo">
      <div class="label">float</div>
      <div class="stage"><div class="float-box"></div></div>
      <div class="spec">8s ease-in-out infinite</div>
    </div>
    <div class="demo">
      <div class="label">ticker · capability bar</div>
      <div class="stage ticker-stage"><div class="ticker-row"><span>• Generative AI</span><span>• Predictive</span><span>• Chatbots</span><span>• MLOps</span></div></div>
      <div class="spec">30s linear infinite</div>
    </div>
  </div>
</div>
</body></html>
