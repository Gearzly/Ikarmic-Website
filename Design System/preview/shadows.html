<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="common.css">
<style>
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; padding-top: 8px; }
.demo { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.demo .box { width: 100%; height: 70px; border-radius: 12px; background: #4f46e5; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; font-weight: 600; }
.demo .nm { font-size: 11px; color: #f5f5f5; font-weight: 600; font-family: "JetBrains Mono", monospace; }
.demo .desc { font-size: 10px; color: #525252; font-family: "JetBrains Mono", monospace; }
</style></head><body>
<div class="card" style="padding: 24px 28px;">
  <p class="eyebrow" style="margin-bottom: 0;">Glow &amp; Shadow System</p>
  <div class="grid">
    <div class="demo">
      <div class="box" style="box-shadow: 0 0 28px rgba(99,102,241,0.4);">Hover CTA</div>
      <div class="nm">--shadow-cta</div>
      <div class="desc">0 0 28px indigo/0.40</div>
    </div>
    <div class="demo">
      <div class="box" style="box-shadow: 0 0 40px rgba(99,102,241,0.45);">Hero CTA</div>
      <div class="nm">--shadow-cta-lg</div>
      <div class="desc">0 0 40px indigo/0.45</div>
    </div>
    <div class="demo">
      <div class="box" style="background: #171717; border:1px solid #262626; box-shadow: 0 0 40px rgba(99,102,241,0.12); color:#a3a3a3;">Featured card</div>
      <div class="nm">--shadow-feature</div>
      <div class="desc">0 0 40px indigo/0.12</div>
    </div>
  </div>
</div>
</body></html>
