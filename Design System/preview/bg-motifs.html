<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="common.css">
<style>
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.m { position: relative; height: 130px; border-radius: 14px; overflow: hidden; border: 1px solid #262626; }
.lbl { position: absolute; bottom: 8px; left: 10px; font-size: 10px; color: #f5f5f5; font-family: "JetBrains Mono", monospace; padding: 4px 8px; background: rgba(0,0,0,0.5); border-radius: 4px; backdrop-filter: blur(4px); }
.dotgrid { background: #0a0a0a; }
.dotgrid::before { content:""; position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(99,102,241,0.5) 1px, transparent 1px); background-size: 18px 18px; opacity: 0.5; }
.dotgrid::after { content:""; position: absolute; inset: 0; background: radial-gradient(ellipse 80% 60% at 50% 50%, transparent 40%, #030712 100%); }
.blobs { background: #0a0a0a; }
.blobs .blob1 { position: absolute; top: 20%; left: -10%; width: 60%; height: 90%; border-radius: 50%; background: rgba(67,56,202,0.4); filter: blur(50px); }
.blobs .blob2 { position: absolute; bottom: 20%; right: -10%; width: 50%; height: 80%; border-radius: 50%; background: rgba(91,33,182,0.3); filter: blur(50px); }
</style></head><body>
<div class="card" style="padding: 22px 28px;">
  <p class="eyebrow" style="margin-bottom: 0;">Background Motifs · Calm Cosmic</p>
  <div class="row">
    <div class="m dotgrid"><div class="lbl">dot-grid · 36px · indigo/0.15</div></div>
    <div class="m blobs"><div class="blob1"></div><div class="blob2"></div><div class="lbl">floating blobs · blur(80–90px)</div></div>
  </div>
</div>
</body></html>
