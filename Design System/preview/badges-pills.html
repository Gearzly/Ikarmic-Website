<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="common.css">
<style>
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.15em; }
.pill-brand { background: rgba(49,46,129,0.5); border: 1px solid rgba(67,56,202,0.5); color:#a5b4fc; }
.pill-dot { width: 8px; height: 8px; border-radius: 999px; background:#818cf8; }
.tag { display: inline-flex; align-items: center; padding: 5px 12px; border-radius: 999px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; border: 1px solid; }
.tag-strat { background: rgba(49,46,129,0.6); color: #818cf8; border-color: rgba(55,48,163,0.4); }
.tag-gov { background: rgba(46,16,101,0.6); color: #a78bfa; border-color: rgba(91,33,182,0.4); }
.tag-prod { background: rgba(2,44,34,0.6); color: #34d399; border-color: rgba(6,95,70,0.4); }
.duration { font-size: 10px; padding: 4px 10px; border-radius: 999px; background: rgba(49,46,129,0.5); color: #818cf8; border: 1px solid rgba(55,48,163,0.4); font-weight: 600; }
.lbl { font-size: 10px; color: #525252; font-family: "JetBrains Mono", monospace; }
</style></head><body>
<div class="card" style="padding: 24px 28px; gap: 14px;">
  <p class="eyebrow" style="margin-bottom: 0;">Badges &amp; Pills</p>
  <div class="row">
    <span class="pill pill-brand"><span class="pill-dot"></span>AI Services &amp; Solutions Company</span>
  </div>
  <div class="row">
    <span class="tag tag-strat">Strategy</span>
    <span class="tag tag-gov">Governance</span>
    <span class="tag tag-prod">Product</span>
    <span class="duration">Week 1</span>
    <span class="duration">Weeks 2–5</span>
  </div>
  <div class="lbl">pill · eyebrow badge (with pulsing dot) · blog category tag · phase chip</div>
</div>
</body></html>
