<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="common.css">
<style>
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field label { display: block; font-size: 12px; font-weight: 500; color: #d4d4d4; margin-bottom: 6px; }
.field label .req { color: #818cf8; }
.field input, .field textarea, .field select { width: 100%; padding: 11px 14px; background: #262626; border: 1px solid #404040; color: #fff; border-radius: 8px; font-family: inherit; font-size: 13px; outline: none; }
.field input::placeholder, .field textarea::placeholder { color: #737373; }
.field input:focus, .field select:focus { border-color: #6366f1; }
.field.err input { border-color: #fb7185; }
.field .e { color:#fb7185; font-size: 10px; margin-top: 4px; }
.full { grid-column: 1 / -1; }
</style></head><body>
<div class="card" style="padding: 22px 28px; gap: 14px;">
  <p class="eyebrow" style="margin-bottom: 0;">Form Inputs</p>
  <div class="grid">
    <div class="field"><label>Name <span class="req">*</span></label><input type="text" placeholder="Jane Smith" value="Priya R." /></div>
    <div class="field err"><label>Email <span class="req">*</span></label><input type="text" value="not-an-email" /><div class="e">Please enter a valid email address.</div></div>
    <div class="field full"><label>I'm interested in</label><select><option>AI Chatbots &amp; Conversational AI</option></select></div>
  </div>
</div>
</body></html>
