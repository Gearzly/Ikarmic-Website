<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="common.css">
<style>
.row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; text-decoration: none; border: 1px solid transparent; font-family: inherit; }
.btn-primary { background: #4f46e5; color: #fff; }
.btn-primary:hover { background: #6366f1; box-shadow: 0 0 28px rgba(99,102,241,0.4); }
.btn-secondary { background: rgba(255,255,255,0.05); color: #fff; border-color: rgba(255,255,255,0.10); }
.btn-secondary:hover { background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.20); }
.btn-text { background: transparent; color: #818cf8; padding: 12px 0; }
.btn-text:hover { color: #a5b4fc; }
.btn-sm { padding: 8px 16px; border-radius: 10px; font-size: 13px; }
.lbl { font-size: 10px; color: #525252; font-family: "JetBrains Mono", monospace; margin-top: 6px; }
.col { display: flex; flex-direction: column; align-items: flex-start; }
</style></head><body>
<div class="card" style="padding: 24px 28px;">
  <p class="eyebrow" style="margin-bottom: 0;">Buttons</p>
  <div class="row">
    <div class="col">
      <a class="btn btn-primary">Start a project
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
      </a>
      <span class="lbl">primary · indigo-600</span>
    </div>
    <div class="col">
      <a class="btn btn-secondary">View Solutions</a>
      <span class="lbl">secondary · white/5</span>
    </div>
    <div class="col">
      <a class="btn btn-text">All services →</a>
      <span class="lbl">tertiary · text-link</span>
    </div>
    <div class="col">
      <a class="btn btn-primary btn-sm">Get in touch</a>
      <span class="lbl">primary · sm</span>
    </div>
  </div>
</div>
</body></html>
