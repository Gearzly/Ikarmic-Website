<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="common.css">
<style>
.fly { width: 100%; max-width: 480px; border-radius: 16px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.06); background: linear-gradient(160deg, #1a1a2e 0%, #16161a 100%); }
.fly .top { height: 1px; background: linear-gradient(90deg, transparent, rgba(99,102,241,0.6), transparent); }
.fly .grid { padding: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.fly .row { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 10px; transition: background 0.18s; cursor: pointer; }
.fly .row:hover { background: rgba(255,255,255,0.05); }
.fly .ico { width: 34px; height: 34px; border-radius: 8px; background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.2); display: flex; align-items: center; justify-content: center; color: #818cf8; flex-shrink: 0; }
.fly .lab { font-size: 12px; font-weight: 500; color: #f5f5f5; }
.fly .desc { font-size: 11px; color: #737373; margin-top: 2px; line-height: 1.3; }
.fly .foot { margin: 8px; padding: 9px 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
.fly .foot .a { font-size: 11px; color: #525252; }
.fly .foot .b { font-size: 11px; font-weight: 600; color: #818cf8; }
</style></head><body>
<div class="card" style="padding: 20px 28px;">
  <p class="eyebrow" style="margin-bottom: 0;">Nav Flyout Menu</p>
  <div class="fly">
    <div class="top"></div>
    <div class="grid">
      <div class="row"><div class="ico"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg></div><div><div class="lab">AI Chatbots</div><div class="desc">24/7 support, no extra headcount</div></div></div>
      <div class="row"><div class="ico"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div><div><div class="lab">Automation</div><div class="desc">Eliminate repetitive work</div></div></div>
    </div>
    <div class="foot"><span class="a">Not sure which fits?</span><span class="b">All Services →</span></div>
  </div>
</div>
</body></html>
