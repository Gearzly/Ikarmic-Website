<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="common.css">
<style>
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.c { background: #171717; border: 1px solid #262626; border-radius: 16px; padding: 18px; transition: border-color 0.2s; }
.c:hover { border-color: rgba(55,48,163,0.5); }
.c .ico { width: 36px; height: 36px; border-radius: 10px; background:#312e81; border: 1px solid rgba(67,56,202,0.6); display: flex; align-items: center; justify-content: center; margin-bottom: 10px; color: #818cf8; }
.c .nm { font-size: 14px; font-weight: 700; color: #fff; margin: 0 0 4px 0; }
.c .ds { font-size: 12px; color: #a3a3a3; margin: 0; line-height: 1.5; }
.gw { padding: 1px; border-radius: 16px; background: linear-gradient(135deg, rgba(79,70,229,0.4), rgba(124,58,237,0.2), rgba(79,70,229,0.4)); }
.gw .inner { background: #0a0a0a; border-radius: 15px; padding: 18px; text-align: center; }
.gw .val { font-size: 32px; font-weight: 700; color: #818cf8; line-height: 1; margin-bottom: 6px; }
.gw .lab { font-size: 12px; color: #f5f5f5; font-weight: 600; }
.gw .sub { font-size: 10px; color: #737373; margin-top: 2px; }
</style></head><body>
<div class="card" style="padding: 24px 28px;">
  <p class="eyebrow" style="margin-bottom: 0;">Card Variants</p>
  <div class="grid">
    <div class="c">
      <div class="ico"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg></div>
      <p class="nm">Default card</p>
      <p class="ds">neutral-900 surface, neutral-800 border, hover brightens to indigo-800/50.</p>
    </div>
    <div class="gw">
      <div class="inner">
        <div class="val">65%</div>
        <div class="lab">Ticket deflection</div>
        <div class="sub">gradient-border stat card</div>
      </div>
    </div>
  </div>
</div>
</body></html>
