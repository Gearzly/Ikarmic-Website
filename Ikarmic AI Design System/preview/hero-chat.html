<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="common.css">
<style>
.demo { border: 1px solid rgba(64,64,64,0.6); background: #171717; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05); }
.bar { display: flex; align-items: center; gap: 6px; padding: 10px 14px; background: rgba(38,38,38,0.7); border-bottom: 1px solid rgba(64,64,64,0.5); }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.dot.r { background: rgba(239,68,68,0.7); }
.dot.y { background: rgba(234,179,8,0.7); }
.dot.g { background: rgba(34,197,94,0.7); }
.title { margin-left: 8px; display: flex; align-items: center; gap: 6px; font-size: 11px; color: #d4d4d4; font-weight: 500; }
.green-pulse { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; }
.body { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
.msg { display: flex; gap: 8px; }
.msg.user { justify-content: flex-end; }
.msg .av { width: 22px; height: 22px; border-radius: 6px; background: #4f46e5; color: #fff; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.msg.user .av { background: #404040; color: #d4d4d4; }
.bub { max-width: 78%; padding: 8px 12px; border-radius: 14px; font-size: 12px; line-height: 1.45; }
.bub.ai { background: #262626; color: #e5e5e5; border: 1px solid rgba(64,64,64,0.5); border-bottom-left-radius: 4px; }
.bub.user { background: #4f46e5; color: #fff; border-bottom-right-radius: 4px; }
</style></head><body>
<div class="card" style="padding: 22px 28px;">
  <p class="eyebrow" style="margin-bottom: 0;">Hero Chat Demo — Signature Component</p>
  <div class="demo">
    <div class="bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="title"><span class="green-pulse"></span>Ikarmic AI</span>
    </div>
    <div class="body">
      <div class="msg user"><div class="bub user">How fast can you deploy an AI chatbot?</div><div class="av">You</div></div>
      <div class="msg"><div class="av">AI</div><div class="bub ai">Typically 2–3 weeks. We handle integration, training data, and testing.</div></div>
    </div>
  </div>
</div>
</body></html>
