<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="common.css">
<style>
.scale { display: grid; grid-template-columns: repeat(9, 1fr); gap: 8px; }
.swatch .chip { height: 56px; }
.swatch .name { color: #f5f5f5; font-weight: 600; font-size: 10px; }
</style></head><body>
<div class="card">
  <div>
    <p class="eyebrow" style="margin-bottom: 4px;">Brand · Indigo Scale</p>
    <p class="meta" style="margin: 0;">--color-brand family · the single accent</p>
  </div>
  <div class="scale">
    <div class="swatch"><div class="chip" style="background:#eef2ff"></div><div class="name">50</div><div>#eef2ff</div></div>
    <div class="swatch"><div class="chip" style="background:#e0e7ff"></div><div class="name">100</div><div>#e0e7ff</div></div>
    <div class="swatch"><div class="chip" style="background:#c7d2fe"></div><div class="name">200</div><div>#c7d2fe</div></div>
    <div class="swatch"><div class="chip" style="background:#a5b4fc"></div><div class="name">300</div><div>#a5b4fc</div></div>
    <div class="swatch"><div class="chip" style="background:#818cf8; box-shadow: 0 0 0 1px rgba(255,255,255,0.15) inset;"></div><div class="name" style="color:#a5b4fc">400★</div><div>#818cf8</div></div>
    <div class="swatch"><div class="chip" style="background:#6366f1; box-shadow: 0 0 0 1px rgba(255,255,255,0.15) inset;"></div><div class="name" style="color:#a5b4fc">500★</div><div>#6366f1</div></div>
    <div class="swatch"><div class="chip" style="background:#4f46e5; box-shadow: 0 0 0 1px rgba(255,255,255,0.15) inset;"></div><div class="name" style="color:#a5b4fc">600★</div><div>#4f46e5</div></div>
    <div class="swatch"><div class="chip" style="background:#4338ca"></div><div class="name">700</div><div>#4338ca</div></div>
    <div class="swatch"><div class="chip" style="background:#312e81"></div><div class="name">950</div><div>#312e81</div></div>
  </div>
  <p class="meta" style="margin: 0; color:#737373;">★ used in product · 400 accents · 500 brand · 600 buttons</p>
</div>
</body></html>
