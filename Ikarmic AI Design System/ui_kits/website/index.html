<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ikarmic AI · Website UI Kit</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="megamenu.css">
</head>
<body data-screen-label="Ikarmic Marketing Site · Home">
  <div id="root"></div>

  <!-- React -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Data + Helpers -->
  <script src="data.js"></script>

  <!-- Components (JSX, Babel-transformed) -->
  <script type="text/babel" src="AnimateIn.jsx"></script>
  <script type="text/babel" src="Icon.jsx"></script>
  <script type="text/babel" src="MegaMenu.jsx"></script>
  <script type="text/babel" src="Navbar.jsx"></script>
  <script type="text/babel" src="HeroChatDemo.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="Ticker.jsx"></script>
  <script type="text/babel" src="StatCard.jsx"></script>
  <script type="text/babel" src="ServiceCard.jsx"></script>
  <script type="text/babel" src="StepsSection.jsx"></script>
  <script type="text/babel" src="BlogCard.jsx"></script>
  <script type="text/babel" src="CTASection.jsx"></script>

  <!-- App -->
  <script type="text/babel">
    function App() {
      return (
        <React.Fragment>
          <Navbar />
          <main style={{ paddingTop: "4rem" }}>
            <Hero />
            <Ticker />
            <StatsSection />
            <ServicesSection />
            <StepsSection />
            <TestimonialsSection />
            <BlogSection />
            <CTASection />
          </main>
          <Footer />
        </React.Fragment>
      );
    }

    // Wait for all Babel-transformed scripts to register globals.
    function start() {
      const ready = window.Navbar && window.MegaMenu && window.Hero && window.HeroChatDemo && window.Ticker
                 && window.StatsSection && window.ServicesSection && window.StepsSection
                 && window.TestimonialsSection && window.BlogSection
                 && window.CTASection && window.Footer && window.FadeUp;
      if (!ready) return setTimeout(start, 30);
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    }
    start();
  </script>
</body>
</html>
